version: "1"
services:
  # ==========================================
  # 1. 백엔드 웹 서비스 (Python FastAPI)
  # ==========================================
  - type: web
    name: jemini-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CHAT_ENCRYPTION_KEY
        sync: false
      - key: DEFAULT_LLM_PROVIDER
        value: "google_genai"
      - key: DEFAULT_LLM_MODEL
        value: "gemini-3.6-flash"

  # ==========================================
  # 2. 프론트엔드 정적 호스팅 (React Vite)
  # ==========================================
  - type: web
    name: jemini-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        value: "https://jemini-backend-4ftg.onrender.com/api"
      - key: VITE_SUPABASE_URL
        value: "https://xuuqejnjtklxkvqfqrxr.supabase.co"
